# ABOUTME: Reusable GitHub Actions workflow for ReGrade differential testing.
# ABOUTME: Provides record-on-default-branch plus replay and analysis jobs on PRs for customer pipelines.
#
# Usage: a GitHub workflow can only reuse a workflow that lives in a GitHub
# repository, and this file is published from GitLab. Copy it into your
# repository as .github/workflows/regrade-template.yml and call it from a
# caller workflow by that path:
#
#   name: ReGrade
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   permissions:
#     contents: read
#     pull-requests: write   # the analysis job posts its comment; the record job reads the merged pull request
#   jobs:
#     regrade:
#       uses: ./.github/workflows/regrade-template.yml
#       with:
#         app-image: ghcr.io/your-org/your-app:${{ github.sha }}
#         app-image-is-merge-result: true   # github.sha is the merge commit; drop this if you build the PR head
#         app-port: '8080'
#         test-command: 'sh tests.sh'
#         profile: my-profile
#       secrets:
#         regrade-api-key: ${{ secrets.REGRADE_API_KEY }}
#
# The workflow runs a record job on the default branch, and on pull requests a
# replay job and an analysis job. The replay job downloads the CLI and the
# analysis job downloads the regrade-analyze binary, both at job start from
# app.regrade.curtail.com, so no custom container image is required.
#
# If you require the ReGrade status check in branch protection, require the
# regrade-analyze job too.

name: ReGrade Differential Testing

on:
  workflow_call:
    inputs:
      app-image:
        description: "Docker image of application under test (must be pullable from the runner)"
        required: true
        type: string
      app-image-is-merge-result:
        description: "Set true when app-image is built from the pull request's merge commit (github.sha, which the default checkout and the usage example at the top of the file use). The replay then compares with the base commit that merge was built on. Leave false when app-image is built from the pull request head, which compares with the branch point."
        required: false
        type: boolean
        default: false
      job-image:
        description: "Image the record job runs in, which is where test-command executes. Override when your suite needs more than busybox (bash, node, python). Must be able to run test-command."
        required: false
        type: string
        default: "alpine:latest"
      registry-username:
        description: "Username for the registry holding app-image. Leave empty for a public image."
        required: false
        type: string
        default: ""
      app-port:
        description: "Port the application listens on"
        required: false
        type: string
        default: "8080"
      test-command:
        description: "Command to run test suite (auto-proxied via http_proxy)"
        required: true
        type: string
      profile:
        description: "ReGrade profile name for noise filtering"
        required: true
        type: string
      api-url:
        description: "ReGrade API URL"
        required: false
        type: string
        default: "https://api.regrade.curtail.com/api/v1"
      downloads-url:
        description: "Base URL for the ReGrade downloads (sensor binary + regrade-analyze binary)"
        required: false
        type: string
        default: "https://app.regrade.curtail.com/downloads/latest"
      enable-llm:
        description: "Enable LLM-powered delta classification (sends delta summaries to LLM provider)"
        required: false
        type: boolean
        default: false
      llm-model:
        description: "Model the analysis asks (LLM_MODEL). Empty uses claude-sonnet-5-5. Without llm-base-url its prefix picks the provider: claude, gpt-/o1-/o3-/o4-/chatgpt-, or gemini."
        required: false
        type: string
        default: ""
      llm-base-url:
        description: "OpenAI-compatible server every LLM request goes to, such as a locally hosted Ollama or vLLM, including its /v1 (LLM_BASE_URL). Set llm-model to a name it serves. Inputs show in the run log, so put no credentials in the URL; a bearer token goes in the llm-api-key secret."
        required: false
        type: string
        default: ""
      anthropic-base-url:
        description: "Gateway or proxy for Anthropic requests (ANTHROPIC_BASE_URL)."
        required: false
        type: string
        default: ""
      openai-base-url:
        description: "Gateway or proxy for OpenAI requests (OPENAI_BASE_URL)."
        required: false
        type: string
        default: ""
      openai-org-id:
        description: "Sent as the OpenAI-Organization header to any OpenAI-compatible server (OPENAI_ORG_ID)."
        required: false
        type: string
        default: ""
      openai-project-id:
        description: "Sent as the OpenAI-Project header to any OpenAI-compatible server (OPENAI_PROJECT_ID)."
        required: false
        type: string
        default: ""
      google-gemini-base-url:
        description: "Gateway or proxy for Gemini requests (GOOGLE_GEMINI_BASE_URL)."
        required: false
        type: string
        default: ""
      api-timeout-seconds:
        description: "Timeout in seconds for one exchange between the analysis and the ReGrade API, retries included (REGRADE_MCP_TIMEOUT_S). Empty uses 120."
        required: false
        type: string
        default: ""
      fail-on-deltas:
        description: "Fail the workflow when any delta still needs a human decision (unlabeled, suspicious status change, or security finding). An analysis that could not run, or a ReGrade API that does not answer, is reported as a warning and does not block."
        required: false
        type: boolean
        default: false
      source:
        description: "Name of the traffic source this job records or replays, such as schemathesis or zap. Set it when one repository has more than one record job: the recording is tagged source=<value>, and the replay picks its baseline only from recordings with the same tag. Letters, digits, '.', '_' and '-'. Leave empty for a single source."
        required: false
        type: string
        default: ""
      team-id:
        description: "UUID of the ReGrade team that owns the recordings and replays. The API key's owner must be a member of it. Empty leaves the choice to the API, which uses the key owner's default team. Needs a sensor version with --team-id."
        required: false
        type: string
        default: ""
    secrets:
      registry-password:
        description: "Password or token for registry-username. Leave unset for a public image."
        required: false
      regrade-api-key:
        description: "ReGrade API key for sensor authentication"
        required: true
      llm-api-key:
        description: "LLM provider API key, required when enable-llm is true unless the analysis job sets LLM_BASE_URL"
        required: false
      test-secret:
        description: "A credential the test command needs, such as an API scanner's token. The record job exports it to test-command as REGRADE_TEST_SECRET. A called workflow receives only the secrets it declares, so this is how one reaches the test command."
        required: false

env:
  # The phase helpers every job writes to /tmp/regrade-phase.sh for their later
  # steps to source. Jobs share no files, so each job writes its own copy, and
  # the text lives here once so the copies cannot drift apart.
  REGRADE_PHASE_SH: |-
    regrade_phase() {  # <n/total> <name> <what is about to happen>
      REGRADE_PHASE_NAME="$2"
      REGRADE_PHASE_STARTED=$(date +%s)
      printf '\n=== ReGrade %s: %s ===\n' "$1" "$2"
      printf '    %s\n' "$3"
    }
    regrade_phase_done() {  # <ok|failed> <one line of result>
      _regrade_elapsed=$(( $(date +%s) - ${REGRADE_PHASE_STARTED:-0} ))
      if [ "$1" = ok ]; then _regrade_mark='[ok]    '; else _regrade_mark='[FAILED]'; fi
      printf '%s %s took %dm%02ds: %s\n' "$_regrade_mark" "$REGRADE_PHASE_NAME" \
        "$(( _regrade_elapsed / 60 ))" "$(( _regrade_elapsed % 60 ))" "$2"
    }
    regrade_verdict() {  # <PASS|FAIL|WARN> <why> <where to look>
      printf '\n=== ReGrade verdict: %s ===\n' "$1"
      printf '    %s\n' "$2"
      printf '    Gate: REGRADE_FAIL_ON_DELTAS=%s (true means a delta needing a human decision fails this job)\n' \
        "${REGRADE_FAIL_ON_DELTAS:-false}"
      printf '    Report: %s\n' "$3"
      if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
        printf '### ReGrade verdict: %s\n\n%s\n\nGate: REGRADE_FAIL_ON_DELTAS=%s. Report: %s\n' \
          "$1" "$2" "${REGRADE_FAIL_ON_DELTAS:-false}" "$3" >> "$GITHUB_STEP_SUMMARY"
      fi
    }
    regrade_verdict_pass() {  # <analysis.json> <where to look>; the verdict for analyze exit 0
      # analyze exits 0 when nothing it read needs a human decision, also when
      # it could not read the whole delta list; analysis.json says which. A
      # file that is not exactly one JSON object is a warning, not a pass.
      _regrade_analysis=missing
      if [ -f "$1" ]; then
        _regrade_analysis=$(jq -rs 'if length == 1 and (.[0] | type) == "object"
          then (if .[0].incomplete == true then "incomplete" else "complete" end)
          else "unreadable" end' "$1") || _regrade_analysis=unreadable
      fi
      case "$_regrade_analysis" in
        incomplete)
          regrade_verdict WARN "Nothing ReGrade read needs a human decision, but the delta list could not be read completely, so this result may miss deltas. The ReGrade comment and the analyze log say which queries fell short" "$2" ;;
        unreadable)
          regrade_verdict WARN "Nothing ReGrade read needs a human decision, but $1 could not be read, so whether the whole delta list was read is unknown. The ReGrade comment and the analyze log say what was read" "$2" ;;
        *)
          regrade_verdict PASS "Every difference from the baseline was explained by the profile or, with enable-llm, by the LLM classification listed in the comment" "$2" ;;
      esac
    }
    regrade_check_inputs() {  # the source and team-id inputs, before the sensor starts
      # A team id that is not a UUID would otherwise reach the API only
      # after the sensor had started. A source holding a comma, a space
      # or `=` would split into extra tags in the API's tag query, so the
      # replay would select its baseline on tags nobody set.
      case "${REGRADE_INPUT_SOURCE:-}" in
        *[!A-Za-z0-9._-]*)
          echo "FATAL: the source input may hold only letters, digits, '.', '_' and '-', but it is '$REGRADE_INPUT_SOURCE'" >&2
          exit 1 ;;
      esac
      # One bracket expression per hex digit, four to a variable, so the
      # pattern matches a UUID exactly: no leading or trailing text, and no
      # second line.
      REGRADE_HEX4='[0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f]'
      # shellcheck disable=SC2254  # unquoted on purpose: the pattern is the glob
      case "${REGRADE_INPUT_TEAM_ID:-}" in
        ''|$REGRADE_HEX4$REGRADE_HEX4-$REGRADE_HEX4-$REGRADE_HEX4-$REGRADE_HEX4-$REGRADE_HEX4$REGRADE_HEX4$REGRADE_HEX4) ;;
        *)
          echo "FATAL: the team-id input must be a team's UUID, such as 123e4567-e89b-12d3-a456-426614174000, but it is '$REGRADE_INPUT_TEAM_ID'" >&2
          exit 1 ;;
      esac
    }

jobs:
  # Record baseline on default-branch pushes
  regrade-record:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      # The test command runs in this container, so the caller chooses it.
      # Alpine by default, which is enough for a curl-based suite.
      image: ${{ inputs.job-image }}
      # Root whatever USER the image sets: scanner images such as
      # schemathesis/schemathesis run as a non-root user, which cannot install
      # packages or write the sensor to /usr/local/bin.
      options: --user root
    services:
      app-under-test:
        image: ${{ inputs.app-image }}
        # Most real applications live in a private registry. A workflow cannot
        # omit a key conditionally, and GitHub refuses credentials that are
        # empty strings, so the credentials are built only when the caller
        # passes registry-username. Without one they are an empty mapping,
        # which pulls a public image with no login.
        credentials: ${{ inputs.registry-username != '' && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(inputs.registry-username), toJSON(secrets.registry-password))) || fromJSON('{}') }}
        ports:
          - ${{ inputs.app-port }}
    env:
      REGRADE_API_URL: ${{ inputs.api-url }}
      REGRADE_API_KEY: ${{ secrets.regrade-api-key }}
      REGRADE_INPUT_SOURCE: ${{ inputs.source }}
      REGRADE_INPUT_TEAM_ID: ${{ inputs.team-id }}
      REGRADE_TEST_SECRET: ${{ secrets.test-secret }}
      # For the lookup of the pull request this commit was merged from. The
      # token for it is not here: every step of the job, the caller's test
      # command included, would inherit it.
      REGRADE_BASELINE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # GitLab clones the repository for a job; GitHub does not. Without this
      # the caller's test command has nothing to run against. That command
      # runs in this checkout and needs no git credentials, so the workflow
      # token is not left in .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ReGrade sensor
        shell: sh
        run: |
          set -eu
          # The job image is the caller's choice, so do not assume a package
          # manager, and install nothing when curl is already there.
          command -v curl >/dev/null 2>&1 || \
            (command -v apk >/dev/null 2>&1 && apk add --no-cache curl ca-certificates) || \
            (command -v apt-get >/dev/null 2>&1 && apt-get update -qq && apt-get install -y -qq curl ca-certificates) || \
            { echo "curl not found and no supported package manager; add curl to job-image"; exit 1; }
          curl -fsSL "${{ inputs.downloads-url }}/regrade-linux-x86_64" -o /usr/local/bin/regrade
          # The published .sha256 references the versioned filename (e.g.
          # regrade-3.0.0-linux-x86_64), not /usr/local/bin/regrade.
          # Reconstruct the line against the local path before sha256sum -c.
          EXPECTED=$(curl -fsSL "${{ inputs.downloads-url }}/regrade-linux-x86_64.sha256" | awk '{print $1}')
          echo "${EXPECTED}  /usr/local/bin/regrade" | sha256sum -c -
          chmod +x /usr/local/bin/regrade

          # Phase reporting, written to a file because each step gets its own
          # shell. Same output as the GitLab template: what is about to happen,
          # how it went and how long it took, then a verdict naming the rule
          # that decided the run. The verdict also lands on the run summary
          # page, where someone who did not open the log will see it. The file
          # also holds the check of the source and team-id inputs, which the
          # capture and replay steps run before they start the sensor.
          printf '%s\n' "$REGRADE_PHASE_SH" > /tmp/regrade-phase.sh

      # The pull request this commit was merged from, which the recording
      # carries as merged_mr for the project health view: the view finds the
      # most recently merged pull request here, then the replays tagged mr with
      # the same number. The sensor fixes a recording's tags when it starts, so
      # the lookup is the step before it. It is a step of its own so that the
      # token is in its environment alone and not in the test command's. It
      # never fails the job: a recording without the tag is only missing from
      # the health view.
      - name: Find the merged pull request
        shell: sh
        continue-on-error: true
        env:
          REGRADE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          regrade_find_merged_pr() {
            if [ -z "${REGRADE_GITHUB_TOKEN:-}" ]; then
              REGRADE_MERGED_MR_WHY="the workflow has no GitHub token"
              return 1
            fi
            # The install is time limited where `timeout` exists, so a runner
            # with no route to its package mirror cannot stall the job.
            REGRADE_INSTALL_LIMIT=""
            ! command -v timeout >/dev/null 2>&1 || REGRADE_INSTALL_LIMIT="timeout 60"
            command -v jq >/dev/null 2>&1 || \
              (command -v apk >/dev/null 2>&1 && $REGRADE_INSTALL_LIMIT apk add --no-cache jq >/dev/null 2>&1) || \
              (command -v apt-get >/dev/null 2>&1 && $REGRADE_INSTALL_LIMIT apt-get update -qq >/dev/null 2>&1 && $REGRADE_INSTALL_LIMIT apt-get install -y -qq jq >/dev/null 2>&1) || \
              { REGRADE_MERGED_MR_WHY="jq is missing and could not be installed; add jq to job-image"; return 1; }
            # curl exits 22 for an HTTP error status (a token without the
            # permission, a rate limit, a failing server), and anything else for a
            # request that never got an answer.
            REGRADE_MERGED_MR_CURL=0
            REGRADE_MERGED_MR_RESPONSE=$(curl -sS -f --max-time 10 \
              -H "Authorization: Bearer $REGRADE_GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" 2>/dev/null) || REGRADE_MERGED_MR_CURL=$?
            if [ "$REGRADE_MERGED_MR_CURL" = 22 ]; then
              REGRADE_MERGED_MR_WHY="GitHub answered the lookup with an HTTP error (check that the caller's permissions include pull-requests: write, or GitHub was failing)"
              return 1
            elif [ "$REGRADE_MERGED_MR_CURL" != 0 ]; then
              REGRADE_MERGED_MR_WHY="the GitHub API could not be reached (curl exit $REGRADE_MERGED_MR_CURL)"
              return 1
            fi
            # The pull request that produced this commit when GitHub names
            # one, else the first merged into the default branch.
            REGRADE_MERGED_MR=$(printf '%s' "$REGRADE_MERGED_MR_RESPONSE" | jq -r \
              --arg sha "$GITHUB_SHA" --arg branch "$REGRADE_BASELINE_BRANCH" '
                [.[] | select(.merged_at != null and .base.ref == $branch)]
                | (map(select(.merge_commit_sha == $sha)) + .)
                | .[0].number // empty' 2>/dev/null) || {
              REGRADE_MERGED_MR_WHY="the GitHub API answered with something that is not a list of pull requests"
              return 1
            }
            case "$REGRADE_MERGED_MR" in
              ''|*[!0-9]*)
                REGRADE_MERGED_MR=""
                REGRADE_MERGED_MR_WHY="GitHub names no merged pull request for commit $GITHUB_SHA (a direct push has none)"
                return 1 ;;
            esac
          }
          REGRADE_MERGED_MR=""
          regrade_find_merged_pr || echo "WARNING: this recording is not tagged merged_mr because $REGRADE_MERGED_MR_WHY. This project will not show a health status on the project health dashboard until a default-branch recording finds its pull request. Recording continues."
          # Handed to the record step, which has no token.
          [ -z "$REGRADE_MERGED_MR" ] || printf 'REGRADE_MERGED_MR=%s\n' "$REGRADE_MERGED_MR" >> "$GITHUB_ENV"

      - name: Record baseline traffic
        shell: sh
        run: |
          set -eu
          . /tmp/regrade-phase.sh
          regrade_check_inputs
          regrade_phase "1/2" "capture" "Recording every request the test suite makes, through the proxy on port 8888 to http://app-under-test:${{ inputs.app-port }}, tagged pipeline=$GITHUB_RUN_ID${REGRADE_INPUT_SOURCE:+ and source=$REGRADE_INPUT_SOURCE}"
          regrade proxy \
            --target http://app-under-test:${{ inputs.app-port }} \
            --port 8888 \
            --git-sha "$GITHUB_SHA" \
            --git-branch "${GITHUB_REF#refs/heads/}" \
            --tag ci=true \
            --tag pipeline="$GITHUB_RUN_ID" \
            --tag project="$GITHUB_REPOSITORY" \
            --tag git_branch="${GITHUB_REF#refs/heads/}" \
            ${REGRADE_INPUT_SOURCE:+--tag source="$REGRADE_INPUT_SOURCE"} \
            ${REGRADE_MERGED_MR:+--tag merged_mr="$REGRADE_MERGED_MR"} \
            ${REGRADE_INPUT_TEAM_ID:+--team-id "$REGRADE_INPUT_TEAM_ID"} &
          PROXY_PID=$!

          # The sensor exchanges its API key (and checks for a newer version)
          # before it opens port 8888, so the test command waits until the
          # port is listening: requests made earlier are refused and never
          # recorded.
          # The kernel lists listening sockets in /proc/net/tcp and tcp6 (port
          # 8888 is 22B8 in hex, state 0A is LISTEN), and reading them sends
          # nothing through the proxy, so the check adds no request to the
          # recording. The wait is polled every 0.2s for up to 60s, longer
          # than the sensor's own 30s limit on the key exchange, so a sensor
          # that fails that exits with its own error.
          LISTEN_POLLS=0
          until awk '$2 ~ /:22B8$/ && $4 == "0A" { found = 1 } END { exit !found }' /proc/net/tcp*; do
            # set -e doesn't catch background-process failures. Without this
            # check, a dead proxy (e.g. missing REGRADE_API_KEY) lets the test
            # suite run with http_proxy pointing at nothing — curl falls
            # through to direct, the job exits 0, and ReGrade gets no
            # recording. Silent failure.
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              echo "FATAL: regrade proxy failed to start (likely missing REGRADE_API_KEY)" >&2
              exit 1
            fi
            if [ "$LISTEN_POLLS" -ge 300 ]; then
              echo "FATAL: regrade proxy was not listening on port 8888 after 60s; its log is above" >&2
              kill -TERM "$PROXY_PID"
              exit 1
            fi
            LISTEN_POLLS=$((LISTEN_POLLS + 1))
            sleep 0.2
          done

          # curl deliberately ignores HTTP_PROXY (uppercase) per the httpoxy
          # CVE mitigation — only http_proxy (lowercase) is honored. We set
          # both forms; lowercase is the one that actually matters for
          # curl-based clients.
          export http_proxy=http://localhost:8888
          export https_proxy=http://localhost:8888
          export HTTPS_PROXY=http://localhost:8888
          export REGRADE_PROXY_URL=http://localhost:8888
          export REGRADE_TARGET_URL=http://app-under-test:${{ inputs.app-port }}

          # The test command runs in a subshell with errexit on, so it stops at
          # its first failure as it would on a line of its own. Its status is
          # kept instead of ending the step here: the sensor finalizes the
          # recording only on the stop signal below, and a step that ends
          # without sending it leaves the sensor to the runner's teardown,
          # which loses the whole capture. The step exits with this status
          # after the sensor has stopped, and the summary step reads it
          # through $GITHUB_ENV.
          set +e
          (
            set -e
            ${{ inputs.test-command }}
          )
          TEST_STATUS=$?
          set -e
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "REGRADE_TEST_STATUS=$TEST_STATUS" >> "$GITHUB_ENV"
            echo "The test command exited $TEST_STATUS; stopping the sensor so what it captured before that is kept" >&2
          fi

          # wait returns the sensor's own exit status once it has finalized, and
          # a failed upload exits non-zero, so the phase reports that status
          # rather than assuming the upload happened. The next step is a new
          # shell, so the status reaches its verdict through $GITHUB_ENV.
          #
          # A kill that fails means the sensor was already gone: it died while
          # the test suite ran, so later requests were never recorded, and the
          # step fails.
          if kill -TERM "$PROXY_PID" 2>/dev/null; then
            if wait "$PROXY_PID"; then
              regrade_phase_done ok "test suite finished and the sensor uploaded what it captured"
            else
              SENSOR_STATUS=$?
              echo "REGRADE_SENSOR_STATUS=$SENSOR_STATUS" >> "$GITHUB_ENV"
              regrade_phase_done failed "the sensor exited $SENSOR_STATUS after the stop signal, so the capture may not have been uploaded; its log is above"
            fi
          else
            if wait "$PROXY_PID"; then SENSOR_STATUS=0; else SENSOR_STATUS=$?; fi
            echo "REGRADE_SENSOR_EARLY_EXIT=$SENSOR_STATUS" >> "$GITHUB_ENV"
            regrade_phase_done failed "the sensor exited $SENSOR_STATUS before the test suite finished, so requests after that were not recorded; its log is above"
            exit 1
          fi
          exit "$TEST_STATUS"

      # actions/upload-artifact cannot run in this job: the runner injects a
      # glibc-linked Node binary to execute JavaScript actions and this
      # container is Alpine (musl), so the action fails outright.
      # $GITHUB_STEP_SUMMARY is a plain file, so shell can write the same
      # information to the run page without an action.
      - name: Publish recording summary
        if: always()
        shell: sh
        run: |
          set -eu
          . /tmp/regrade-phase.sh
          regrade_phase "2/2" "read back" "Asking the API what it actually stored for pipeline=$GITHUB_RUN_ID${REGRADE_INPUT_SOURCE:+ and source=$REGRADE_INPUT_SOURCE}"
          # `recordings list` already prints the recording id, entry count, size,
          # git context and tags. An entry count of 0 means the proxy ran but saw
          # no traffic.
          # Branched on rather than swallowed, so an API error is reported as a
          # failed read-back instead of parsing as zero entries. The output is
          # kept on the run page either way. Two record jobs in one run share the
          # pipeline tag, so the source tag is what keeps this listing on the
          # recording this job made.
          if OUT=$(NO_COLOR=1 regrade recordings list --tag pipeline="$GITHUB_RUN_ID" \
            ${REGRADE_INPUT_SOURCE:+--tag source="$REGRADE_INPUT_SOURCE"} --limit 1 2>&1); then
            READ_BACK=ok
          else
            READ_BACK=failed
          fi
          echo "$OUT"
          # shellcheck disable=SC2016  # the backticks are a literal markdown fence
          printf '### ReGrade recording\n\n```\n%s\n```\n' "$OUT" >> "$GITHUB_STEP_SUMMARY"
          REC_ID=$(printf '%s\n' "$OUT" | awk '/\(completed\)/{print $2; exit}')
          ENTRIES=$(printf '%s\n' "$OUT" | awk -F'[: ]+' '/Entries:/{print $3; exit}')
          if [ "$READ_BACK" = ok ]; then
            regrade_phase_done ok "recording ${REC_ID:-unknown}, ${ENTRIES:-unknown} entries"
          else
            regrade_phase_done failed "the API did not answer, so this job cannot confirm what is stored"
          fi
          # A sensor that failed is checked first: a
          # recording that was never finalized reads back with no entries, the
          # same as a run that captured nothing, and needs the opposite fix.
          if [ -n "${REGRADE_SENSOR_EARLY_EXIT:-}" ]; then
            regrade_verdict FAIL "The sensor exited $REGRADE_SENSOR_EARLY_EXIT before the test suite finished, so this baseline is missing the requests made after that. The sensor's error is in the Record baseline traffic step log" \
              "the Record baseline traffic step log"
          elif [ -n "${REGRADE_TEST_STATUS:-}" ]; then
            # The Record baseline traffic step already failed with the test
            # command's own status. A recording the read-back shows as
            # completed is still the newest baseline, so it holds only the
            # requests made before the failure.
            regrade_verdict FAIL "The test command exited $REGRADE_TEST_STATUS, so this job fails. The sensor was stopped afterwards; the capture phase line says whether it finalized, and a completed recording in the read-back holds only the requests made before the failure. Pull requests replay against it until the next run on this branch" \
              "the Record baseline traffic step log, and the recording summary on this run page"
          elif [ -n "${REGRADE_SENSOR_STATUS:-}" ] && [ "$READ_BACK" = ok ] && [ -n "$REC_ID" ] && [ "${ENTRIES:-0}" -gt 0 ] 2>/dev/null; then
            regrade_verdict WARN "The sensor reported an error while stopping (exit $REGRADE_SENSOR_STATUS), but the API holds a completed recording with $ENTRIES entries. Check the sensor's error in the Record baseline traffic step log" \
              "the Record baseline traffic step log"
          elif [ -n "${REGRADE_SENSOR_STATUS:-}" ]; then
            # No completed recording to show for it. The replay job lets a
            # missing baseline through without blocking, because this job goes
            # red and says why; a green job here would leave nothing red
            # anywhere.
            regrade_verdict FAIL "The sensor exited $REGRADE_SENSOR_STATUS after the stop signal, so the recording was not finalized and this baseline is missing or incomplete. The sensor's error is in the Record baseline traffic step log" \
              "the Record baseline traffic step log"
            exit 1
          elif [ "$READ_BACK" = failed ]; then
            regrade_verdict WARN "Traffic was captured and uploaded, but reading it back failed, so this job cannot confirm what is stored" \
              "the recording summary on this run page"
          elif [ "${ENTRIES:-0}" -gt 0 ] 2>/dev/null; then
            regrade_verdict PASS "Baseline recorded for $GITHUB_SHA; pull requests will replay against it" \
              "the recording summary on this run page"
          else
            regrade_verdict WARN "The proxy ran but captured no requests, so this baseline is empty. Check that the test suite was routed through it" \
              "the recording summary on this run page"
          fi

  # Replay on pull requests
  #
  # The replay job re-sends the baseline recording against the pull request's
  # build and reports how that went. The regrade-analyze job judges the deltas
  # and runs only for a replay that completed. This job's outcome output is how
  # the two are joined.
  regrade-replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Gate off keeps today's behavior: nothing here can fail the workflow.
    # Gate on lets the replay fail it for a replay that did not finish,
    # except where the sensor's exit status says the cause is not this pull
    # request's (no baseline, or an API that did not answer).
    continue-on-error: ${{ inputs.fail-on-deltas != true }}
    container:
      image: alpine:latest
    outputs:
      outcome: ${{ steps.replay.outputs.outcome }}
    services:
      app-under-test:
        image: ${{ inputs.app-image }}
        # Most real applications live in a private registry. A workflow cannot
        # omit a key conditionally, and GitHub refuses credentials that are
        # empty strings, so the credentials are built only when the caller
        # passes registry-username. Without one they are an empty mapping,
        # which pulls a public image with no login.
        credentials: ${{ inputs.registry-username != '' && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(inputs.registry-username), toJSON(secrets.registry-password))) || fromJSON('{}') }}
        ports:
          - ${{ inputs.app-port }}
    env:
      REGRADE_API_URL: ${{ inputs.api-url }}
      REGRADE_API_KEY: ${{ secrets.regrade-api-key }}
      REGRADE_PROFILE: ${{ inputs.profile }}
      REGRADE_FAIL_ON_DELTAS: ${{ inputs.fail-on-deltas }}
      REGRADE_INPUT_SOURCE: ${{ inputs.source }}
      REGRADE_INPUT_TEAM_ID: ${{ inputs.team-id }}
      # The branch whose recording is the baseline. The record job runs only on
      # the default branch, so a pull request into any other branch still
      # replays the default branch's recording, as GitLab merge requests do.
      REGRADE_BASELINE_BRANCH: ${{ github.event.repository.default_branch }}
      # The replay finds the branch point from these two (see the replay step).
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REGRADE_APP_IMAGE_IS_MERGE_RESULT: ${{ inputs.app-image-is-merge-result }}
      # Tags the replay mr=<number>, so the project health view can match it
      # to the recording of the pull request once it is merged.
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # actions/checkout clones only when git is on the PATH, and this
      # container has none until a step adds it. Without git it downloads a
      # tarball with no .git, so the replay cannot find the branch point. The
      # runner owns the workspace and this container runs as root, so git
      # refuses it as dubious ownership unless it is marked safe;
      # actions/checkout does that only inside its own temporary config, which
      # later steps do not see.
      - name: Install git for the checkout
        shell: sh
        run: |
          apk add --no-cache git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The replay reads the history only to find the commit the pull request
      # branched from. Nothing later fetches from the remote, and the
      # caller's commands run in this checkout, so the workflow token is not
      # left in .git/config.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install ReGrade sensor
        shell: sh
        run: |
          set -eu
          apk add --no-cache curl ca-certificates
          curl -fsSL "${{ inputs.downloads-url }}/regrade-linux-x86_64" -o /usr/local/bin/regrade
          # Published .sha256 files reference versioned filenames; reconstruct
          # the line against the local path before sha256sum -c.
          REGRADE_HASH=$(curl -fsSL "${{ inputs.downloads-url }}/regrade-linux-x86_64.sha256" | awk '{print $1}')
          printf '%s  /usr/local/bin/regrade\n' "$REGRADE_HASH" | sha256sum -c -
          chmod +x /usr/local/bin/regrade

          # Phase reporting, written to a file because each step gets its own
          # shell. Same output as the GitLab template: what is about to happen,
          # how it went and how long it took, then a verdict naming the rule
          # that decided the run. The verdict also lands on the run summary
          # page, where someone who did not open the log will see it. The file
          # also holds the check of the source and team-id inputs, which the
          # capture and replay steps run before they start the sensor.
          printf '%s\n' "$REGRADE_PHASE_SH" > /tmp/regrade-phase.sh

      - name: Replay recorded baseline against PR head
        id: replay
        shell: sh
        run: |
          set -eu
          . /tmp/regrade-phase.sh
          mkdir -p regrade-summary
          regrade_check_inputs
          # Which commit's recording is the baseline. This workflow's checkout
          # is the merge ref on every pull_request run, so git cannot say what
          # the caller built app-image from: the caller says so with
          # app-image-is-merge-result. When it is true, the baseline is the
          # merge commit's first parent, the base branch commit the merge was
          # built on, provided HEAD really is the merge of the pull request's
          # head (two parents, the second being the head). pull_request.base.sha
          # is the base branch's tip when the event fired, which may be newer
          # than that commit, so it is not used for this. Otherwise the baseline
          # is the branch point.
          BASELINE_SHA=""
          BASELINE_NAME=""
          PHASE_BASELINE=""
          MERGE_REF_WARNING=""
          if [ "${REGRADE_APP_IMAGE_IS_MERGE_RESULT:-false}" = true ]; then
            if [ -n "${GITHUB_HEAD_SHA:-}" ] \
              && [ "$(git rev-list --parents -n 1 HEAD 2>/dev/null | wc -w)" -eq 3 ] \
              && [ "$(git rev-parse HEAD^2 2>/dev/null)" = "$GITHUB_HEAD_SHA" ]; then
              BASELINE_SHA=$(git rev-parse HEAD^1)
              BASELINE_NAME="the base commit this merge was built on"
              PHASE_BASELINE="the base commit the merge of this pull request was built on"
            else
              MERGE_REF_WARNING="WARNING: app-image-is-merge-result is true, but the checkout is not the merge commit of this pull request; using the branch point instead"
            fi
          fi
          if [ -z "$BASELINE_SHA" ] && [ -n "${GITHUB_BASE_SHA:-}" ]; then
            # The branch point is the merge base of the base tip and the head,
            # read from the full history the checkout above fetches.
            if BASELINE_SHA=$(git merge-base "$GITHUB_BASE_SHA" "${GITHUB_HEAD_SHA:-HEAD}"); then
              BASELINE_NAME="the branch point"
              PHASE_BASELINE="the branch point of this pull request"
            else
              BASELINE_SHA=""
              MERGE_REF_WARNING="$MERGE_REF_WARNING WARNING: could not find where this pull request branched from $GITHUB_BASE_SHA in the checkout; comparing with the newest $REGRADE_BASELINE_BRANCH recording instead"
            fi
          fi
          regrade_phase "1/2" "replay" "Re-sending the $REGRADE_BASELINE_BRANCH recording${PHASE_BASELINE:+ made at $PHASE_BASELINE (or the newest)}${REGRADE_INPUT_SOURCE:+ from source $REGRADE_INPUT_SOURCE} against http://app-under-test:${{ inputs.app-port }}${REGRADE_PROFILE:+ through profile $REGRADE_PROFILE}, to compare this commit's responses with the baseline"
          [ -z "$MERGE_REF_WARNING" ] || echo "$MERGE_REF_WARNING"
          # The outcome of this replay, for the analysis job. It is written
          # exactly once, by the branch below that the replay's exit status
          # takes, because a step output written twice depends on which write
          # the runner keeps. A step that ended before that branch (a failed
          # input check, say) writes nothing, the output is empty, and the
          # analysis job, which runs only for "completed", is skipped.
          regrade_replay_outcome() {
            printf 'outcome=%s\n' "$1" >> "$GITHUB_OUTPUT"
          }
          # The sensor's exit status says why a replay ended, so this script
          # reads that and never the sensor's text. `regrade --help` lists the
          # statuses; the two this script tells apart from a failed replay are:
          #   66  no recording matches the tags the replay filters on
          #   75  the ReGrade API did not answer, or stopped answering
          # Any other non-zero status is a failed replay. The sensor's output
          # goes to a file and is printed afterwards, not piped through tee:
          # this shell has no pipefail, so a pipeline reports tee's status and
          # a 66 or 75 would read as 0, passing a replay that never happened.
          #
          # --quiet suppresses per-request chatter only. The delta breakdown at
          # the end is printed, not logged, so it survives. The file keeps a
          # copy: the breakdown is the one place the labeled/unlabeled split
          # exists.
          #
          # --profile only when there is one. An empty profile name is not a
          # request for "no profile", it is a request for a profile called ""
          # and the API has no reason to find one. The GitLab template has
          # always omitted it this way.
          #
          # The baseline is chosen by tag match, newest first. git_branch and
          # ci are shared by every repository recording into the same ReGrade
          # team, so project is what keeps this replay on its own
          # application's recording. source does the same for two traffic
          # sources in one repository, and it tags the replay too, so the
          # read-back finds this job's replay.
          regrade_replay() {
            regrade_replay_status=0
            regrade replay \
              --tag git_branch="${REGRADE_BASELINE_BRANCH}" --tag ci=true \
              --tag project="$GITHUB_REPOSITORY" \
              ${REGRADE_INPUT_SOURCE:+--tag source="$REGRADE_INPUT_SOURCE"} \
              "$@" \
              --target http://app-under-test:${{ inputs.app-port }} \
              ${REGRADE_PROFILE:+--profile "$REGRADE_PROFILE"} \
              --replay-tag commit="$GITHUB_SHA" \
              --replay-tag pipeline="$GITHUB_RUN_ID" \
              ${REGRADE_INPUT_SOURCE:+--replay-tag source="$REGRADE_INPUT_SOURCE"} \
              ${GITHUB_PR_NUMBER:+--replay-tag mr="$GITHUB_PR_NUMBER"} \
              ${REGRADE_INPUT_TEAM_ID:+--team-id "$REGRADE_INPUT_TEAM_ID"} \
              --quiet > regrade-summary/replay-output.txt 2>&1 || regrade_replay_status=$?
            cat regrade-summary/replay-output.txt
            return "$regrade_replay_status"
          }
          # Says which baseline this run chose, in the log and on the run page.
          regrade_baseline_note() {
            echo "Baseline: $1"
            printf '### ReGrade baseline\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          # A pull request replays the recording of the commit its code was
          # built on (the sensor tags each recording with git_sha): the newest
          # recording can hold changes this build does not have, and every
          # delta those changes cause would be reported against it. With
          # app-image-is-merge-result true that commit is the merge's first
          # parent. Otherwise it is the branch point, which cannot see what the
          # base branch gained after it. When that commit has no recording (status
          # 66), the newest is used and the log says so. The status of the
          # last replay run is the one that decides the job.
          REPLAY_STATUS=0
          if [ -n "$BASELINE_SHA" ] && [ "$BASELINE_NAME" = "the branch point" ]; then
            ADVICE=""
            if [ "${REGRADE_APP_IMAGE_IS_MERGE_RESULT:-false}" != true ]; then
              ADVICE=" To replay the merge instead, build app-image from github.sha (the pull request's merge commit) and set app-image-is-merge-result: true."
            fi
            regrade_baseline_note "the recording of the branch point $BASELINE_SHA. This is the weaker check: it cannot see breakage of changes that landed on $REGRADE_BASELINE_BRANCH after the branch point.${ADVICE}"
          elif [ -n "$BASELINE_SHA" ]; then
            regrade_baseline_note "the recording of $BASELINE_NAME, $BASELINE_SHA"
          else
            regrade_baseline_note "the newest $REGRADE_BASELINE_BRANCH recording"
          fi
          if [ -n "$BASELINE_SHA" ]; then
            regrade_replay --tag git_sha="$BASELINE_SHA" || REPLAY_STATUS=$?
            case "$REPLAY_STATUS" in
              66)
                echo "WARNING: no recording of $BASELINE_NAME $BASELINE_SHA; comparing with the newest $REGRADE_BASELINE_BRANCH recording instead, which may include changes this build does not have"
                REPLAY_STATUS=0
                regrade_replay || REPLAY_STATUS=$?
                ;;
            esac
          else
            regrade_replay || REPLAY_STATUS=$?
          fi
          case "$REPLAY_STATUS" in
            0)
              # The sensor's own block is the only place the labeled/unlabeled
              # split exists, so the phase line quotes it back rather than
              # recomputing it.
              SUMMARY=$(awk -F': +' '
                /^  Requests:/ { n = split($2, a, " "); reqs = a[1]; rest = "";
                                 for (i = 2; i <= n; i++) rest = rest (i > 2 ? " " : "") a[i] }
                /^  Deltas:/   { d = $2 }
                END { if (reqs != "") printf "%s requests%s, deltas: %s", reqs, (rest == "" ? "" : " " rest), d }
              ' regrade-summary/replay-output.txt)
              regrade_replay_outcome completed
              regrade_phase_done ok "${SUMMARY:-replay finished}"
              ;;
            66)
              regrade_replay_outcome no-baseline
              regrade_phase_done failed "the replay did not finish; nothing to analyze"
              # No baseline is not a failure of this pull request, and the gate
              # must not block on it: there is nothing the author can do here,
              # because the recording is made by the record workflow on the
              # default branch. It reads the same as a ReGrade outage, which
              # the 75 arm refuses to block on, so it is treated the same way
              # and exits 0.
              #
              # A green step is quiet, and that is acceptable only because a
              # baseline never appears by itself: either the record workflow
              # has not run yet, or it is failing on the default branch and
              # reporting that on its own.
              regrade_verdict WARN "No baseline recording exists yet for $GITHUB_REPOSITORY on ${REGRADE_BASELINE_BRANCH}${REGRADE_INPUT_SOURCE:+ from source $REGRADE_INPUT_SOURCE}, so there was nothing to compare against and this does not block the pull request. Run the record workflow on ${REGRADE_BASELINE_BRANCH}" \
                "the replay step log on this run page"
              exit 0
              ;;
            75)
              regrade_replay_outcome api-unavailable
              regrade_phase_done failed "the ReGrade API at $REGRADE_API_URL did not answer or stopped answering, so the replay did not finish; nothing to analyze"
              # The outage can come before the first request or part way
              # through a replay, so the run is never read back or analyzed.
              # Gate on, it does not block. Gate off, the step exits 1, which
              # continue-on-error keeps from failing the workflow: the same
              # outage signal the analysis job gives when it cannot run.
              regrade_verdict WARN "ReGrade unreachable, not gating this run. $REGRADE_API_URL did not answer or stopped answering, so this commit was not fully compared with the baseline and the pull request is not blocked" \
                "the replay step log on this run page"
              if [ "$REGRADE_FAIL_ON_DELTAS" = "true" ]; then
                exit 0
              fi
              exit 1
              ;;
            *)
              regrade_replay_outcome failed
              regrade_phase_done failed "the replay did not finish; nothing to analyze"
              # Any other replay failure is a real one: the baseline exists and
              # the comparison still did not happen.
              regrade_verdict FAIL "The replay itself failed, so this commit was never compared with the baseline" \
                "the replay step log on this run page"
              exit 1
              ;;
          esac

      - name: Publish replay summary
        # Runs for a replay that completed, which is the only one that stored
        # a run to read back. always() keeps it from being skipped by an
        # earlier step's failure.
        if: always() && steps.replay.outputs.outcome == 'completed'
        shell: sh
        run: |
          set -eu
          . /tmp/regrade-phase.sh
          regrade_phase "2/2" "read back" "Asking the API what it stored for commit=$GITHUB_SHA${REGRADE_INPUT_SOURCE:+ and source=$REGRADE_INPUT_SOURCE}"
          # The replay step already printed its own delta breakdown, which is the
          # part no list command can produce. This adds the API's view of the run.
          # Branched on rather than swallowed, so an API error is reported as a
          # failed read-back instead of [ok]. The output is kept on the run page
          # either way, and the step still succeeds: the replay before it
          # already decided the job. An empty listing is not a confirmation
          # either: the replay tags its run with this commit, so the API's list
          # left it out, or the replay failed before storing one.
          if OUT=$(NO_COLOR=1 regrade replays list --tags commit="$GITHUB_SHA" \
            ${REGRADE_INPUT_SOURCE:+--tags source="$REGRADE_INPUT_SOURCE"} --limit 1 2>&1); then
            if printf '%s\n' "$OUT" | grep -q '^0 replay(s) found'; then
              READ_BACK=empty
            else
              READ_BACK=ok
            fi
          else
            READ_BACK=failed
          fi
          echo "$OUT"
          # shellcheck disable=SC2016  # the backticks are a literal markdown fence
          printf '### ReGrade replay\n\n```\n%s\n```\n' "$OUT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$READ_BACK" = ok ]; then
            regrade_phase_done ok "the API's view of the run is on this run page"
          elif [ "$READ_BACK" = empty ]; then
            regrade_phase_done failed "the API listed no replay tagged commit=$GITHUB_SHA${REGRADE_INPUT_SOURCE:+ and source=$REGRADE_INPUT_SOURCE}, so this job cannot confirm what is stored; the replay itself already finished, so the analysis still runs"
          else
            regrade_phase_done failed "the API did not answer; its error is on this run page, and the replay itself already finished, so the analysis still runs"
          fi

  # Analyze on pull requests
  #
  # LLM classification (optional, opt-in):
  #   When enable-llm is true and llm-api-key or llm-base-url is set, the
  #   analyze step sends API response diff summaries to an LLM for
  #   classification.
  #   Sensitive field values are redacted automatically, but response structure
  #   and non-sensitive content are visible to the LLM provider.
  #
  #   A locally hosted model keeps that data in your network. Run an
  #   OpenAI-compatible server such as Ollama or vLLM and pass:
  #     llm-base-url: http://ollama.internal.example.com:11434/v1
  #     llm-model: llama3.1:8b   (a model name your server serves)
  #   With llm-base-url set, every LLM request goes there whatever the model
  #   name, and llm-api-key is optional (set it if the server wants a bearer
  #   token).
  #
  #   Without llm-base-url, llm-model (default claude-sonnet-5-5) picks
  #   the provider by prefix: claude (Anthropic), gpt-/o1-/o3-/o4-/chatgpt-
  #   (OpenAI) or gemini (Google). anthropic-base-url, openai-base-url and
  #   google-gemini-base-url send those requests through your own gateway.
  #   When set, openai-org-id and openai-project-id go out as headers on every
  #   request to an OpenAI-compatible server: OpenAI, an openai-base-url
  #   gateway or the llm-base-url server.
  #
  #   api-timeout-seconds is the request timeout, in seconds, for one ReGrade
  #   API exchange (default 120). It covers that exchange's retries, which
  #   wait 2, 4 and 8 seconds, so a value below about 15 seconds cuts the
  #   retries short.
  regrade-analyze:
    needs: regrade-replay
    # Only a replay that completed has deltas to judge. Any other outcome
    # (no baseline, an API that did not answer, a failed replay) was already
    # reported by the replay job, and running analyze anyway would report the
    # absence of a replay as a failed analysis. An analysis that is skipped
    # never fails the workflow.
    if: github.event_name == 'pull_request' && needs.regrade-replay.outputs.outcome == 'completed'
    runs-on: ubuntu-latest
    # Gate off keeps today's behavior: nothing here can fail the workflow.
    # Gate on lets the analyze step decide, which it does by exit code.
    continue-on-error: ${{ inputs.fail-on-deltas != true }}
    container:
      image: alpine:latest
    env:
      REGRADE_API_URL: ${{ inputs.api-url }}
      REGRADE_API_KEY: ${{ secrets.regrade-api-key }}
      REGRADE_PROFILE: ${{ inputs.profile }}
      REGRADE_ENABLE_LLM: ${{ inputs.enable-llm }}
      REGRADE_FAIL_ON_DELTAS: ${{ inputs.fail-on-deltas }}
      REGRADE_INPUT_SOURCE: ${{ inputs.source }}
      LLM_API_KEY: ${{ secrets.llm-api-key }}
      # regrade-analyze treats each of these as unset when it is empty.
      LLM_MODEL: ${{ inputs.llm-model }}
      LLM_BASE_URL: ${{ inputs.llm-base-url }}
      ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
      OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
      OPENAI_ORG_ID: ${{ inputs.openai-org-id }}
      OPENAI_PROJECT_ID: ${{ inputs.openai-project-id }}
      GOOGLE_GEMINI_BASE_URL: ${{ inputs.google-gemini-base-url }}
      REGRADE_MCP_TIMEOUT_S: ${{ inputs.api-timeout-seconds }}
      # GitHub-native context regrade-analyze reads for PR comment posting
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # As in the replay job: git must be on the PATH before the checkout, or
      # the checkout has no .git, and the workspace must be marked safe for the
      # steps that run git afterwards.
      - name: Install git for the checkout
        shell: sh
        run: |
          apk add --no-cache git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # analyze compares deltas against the code that changed, so it needs the
      # repository and its history, not just the working tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install regrade-analyze
        shell: sh
        run: |
          set -eu
          # The static binary built for this runner's machine, checked against
          # its published hash.
          case "$(uname -m)" in
            x86_64|amd64) ANALYZE_ARCH=amd64 ;;
            aarch64|arm64) ANALYZE_ARCH=arm64 ;;
            *)
              echo "regrade-analyze is published for linux amd64 (x86_64) and arm64 (aarch64), but this runner is $(uname -m)" >&2
              exit 1 ;;
          esac
          # git was installed before the checkout; jq reads analysis.json
          # for the verdict.
          apk add --no-cache curl ca-certificates jq
          curl -fsSL "${{ inputs.downloads-url }}/regrade-analyze-linux-$ANALYZE_ARCH" -o /usr/local/bin/regrade-analyze
          # Published .sha256 files name the published file; reconstruct
          # the line against the local path before sha256sum -c.
          ANALYZE_HASH=$(curl -fsSL "${{ inputs.downloads-url }}/regrade-analyze-linux-$ANALYZE_ARCH.sha256" | awk '{print $1}')
          printf '%s  /usr/local/bin/regrade-analyze\n' "$ANALYZE_HASH" | sha256sum -c -
          chmod +x /usr/local/bin/regrade-analyze

          # Phase reporting, written to a file because each step gets its own
          # shell. The same helpers the replay job writes.
          printf '%s\n' "$REGRADE_PHASE_SH" > /tmp/regrade-phase.sh

      - name: Classify deltas and post PR comment
        shell: sh
        run: |
          . /tmp/regrade-phase.sh
          mkdir -p regrade-summary
          regrade_phase "1/1" "analyze" "Sorting the deltas into noise and things needing a human decision, and posting the summary to the pull request"
          set +e
          # The replay's source picks this job's replay among those tagged with
          # this commit, and its own pull request comment.
          regrade-analyze --output-json regrade-summary/analysis.json \
            ${REGRADE_INPUT_SOURCE:+--source "$REGRADE_INPUT_SOURCE"}
          code=$?
          set -e
          if [ "$REGRADE_FAIL_ON_DELTAS" != "true" ]; then
            # Gate off: surface the analyze exit code untouched. continue-on-error
            # keeps it from failing the workflow, and a customer watching for a red
            # step as their outage signal still sees one.
            # The arms are enumerated here for the same reason they are below:
            # "analyze refused to run" and "analyze judged the deltas and found
            # unexplained ones" are opposite facts, and reporting the first as
            # the second tells the reader a comparison happened that did not.
            case "$code" in
              0)
                regrade_phase_done ok "no delta needs a human decision"
                regrade_verdict_pass regrade-summary/analysis.json \
                  "the ReGrade comment on this pull request"
                ;;
              1)
                regrade_phase_done failed "analysis could not run (exit 1)"
                regrade_verdict WARN "ReGrade could not analyze this run, so nothing was judged and no delta was ruled out" \
                  "the analyze step log on this run page"
                ;;
              3)
                regrade_phase_done failed "deltas need a human decision, or no replayed request got a response (exit 3)"
                regrade_verdict WARN "Deltas need a human decision, or no replayed request got a response; the analyze log's 'Gate failed:' line says which. The gate is off, so this does not block the pull request" \
                  "the ReGrade comment on this pull request"
                ;;
              *)
                regrade_phase_done failed "analyze exited $code"
                regrade_verdict WARN "The analysis step itself failed, so this run was never judged. The gate is off, so the pull request is not blocked" \
                  "the analyze step log on this run page"
                ;;
            esac
            exit $code
          fi
          # Gate on: continue-on-error is boolean only, so the exit-code split is
          # done here. Only exit 1 (analysis could not run) is swallowed, so a
          # ReGrade outage cannot block a merge. Enumerating the arms matters: a
          # bare test for 3 would let the usage-error exit 2 pass as green.
          case "$code" in
            0)
              regrade_phase_done ok "no delta needs a human decision"
              regrade_verdict_pass regrade-summary/analysis.json \
                "the ReGrade comment on this pull request"
              ;;
            1)
              echo "::warning::ReGrade analysis could not run (exit 1); not blocking"
              regrade_phase_done failed "analysis could not run (exit 1)"
              regrade_verdict WARN "ReGrade could not analyze this run, so the gate is not applied and the pull request is not blocked" \
                "the analyze step log on this run page"
              ;;
            3)
              echo "::error::ReGrade gate: deltas need a human decision, or no replayed request got a response"
              regrade_phase_done failed "deltas need a human decision, or no replayed request got a response (exit 3)"
              regrade_verdict FAIL "Deltas need a human decision, or no replayed request got a response; the analyze log's 'Gate failed:' line says which. Explain deltas with profile rules or fix the change that caused them. For no response, check that the app under test is running at the replay target" \
                "the ReGrade comment on this pull request"
              exit 1
              ;;
            *)
              echo "::error::ReGrade analyze failed (exit $code)"
              regrade_phase_done failed "analyze exited $code"
              regrade_verdict FAIL "The analysis step itself failed, so this run was never judged" \
                "the analyze step log on this run page"
              exit 1
              ;;
          esac
          exit 0
