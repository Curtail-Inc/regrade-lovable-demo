# ABOUTME: ReGrade differential testing for the notes app, via the reusable ReGrade workflow.
# ABOUTME: Builds the app image, then hands recording and replay to the shared template.
#
# This repository is where the shared template gets exercised against a real
# application on real GitHub runners. The template itself lives in
# curtail/regrade3 at ci/templates/regrade-github.yml and is vendored here as
# regrade-template.yml, because a GitHub workflow can only reuse a workflow
# that lives in a GitHub repository. A job in regrade3 fails if the two drift.
#
# What used to be here: a 177-line hand-written copy of the same steps, which
# had drifted (it still pointed people at `regrade refine-profile`, a command
# that never existed). Calling the template instead means this repository tests
# what customers actually run.

name: ReGrade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          # ghcr requires a lowercase repository path
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  regrade:
    needs: build-app
    uses: ./.github/workflows/regrade-template.yml
    with:
      app-image: ${{ needs.build-app.outputs.image }}
      app-port: "8080"
      # sh, not bash: the template runs the test command inside its own job
      # container, which is Alpine and has no bash. tests.sh is POSIX-clean
      # (shellcheck -s sh passes), so it runs unchanged.
      test-command: "sh tests.sh"
      # The image is published to this repository's own ghcr namespace, which
      # is private, so the template needs credentials to pull it as a service.
      registry-username: ${{ github.actor }}
      # Every response carries a served_at timestamp, so without a profile all
      # 19 of them differ and the one difference that matters is buried. This
      # profile drops that one path and nothing else, which is what turns 20
      # deltas into 1. x-request-id needs no rule: the sensor already treats it
      # as noise (DEFAULT_NOISY_RESPONSE_HEADERS).
      profile: "notes-demo"
      fail-on-deltas: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
      regrade-api-key: ${{ secrets.REGRADE_API_KEY }}
